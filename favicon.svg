<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#9d50bb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Round Rect Background -->
  <rect width="512" height="512" rx="128" fill="#090b14" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="8" opacity="0.6" />

  <!-- Outer QR Corner Anchors -->
  <rect x="96" y="96" width="128" height="128" rx="28" fill="none" stroke="url(#glowGrad)" stroke-width="24" filter="url(#neonGlow)" />
  <rect x="136" y="136" width="48" height="48" rx="12" fill="url(#glowGrad)" />

  <rect x="288" y="96" width="128" height="128" rx="28" fill="none" stroke="url(#glowGrad)" stroke-width="24" filter="url(#neonGlow)" />
  <rect x="328" y="136" width="48" height="48" rx="12" fill="url(#glowGrad)" />

  <rect x="96" y="288" width="128" height="128" rx="28" fill="none" stroke="url(#glowGrad)" stroke-width="24" filter="url(#neonGlow)" />
  <rect x="136" y="328" width="48" height="48" rx="12" fill="url(#glowGrad)" />

  <!-- Decorative Matrix Dots & Dynamic Glow Spark -->
  <rect x="288" y="288" width="48" height="48" rx="12" fill="url(#accentGrad)" />
  <rect x="368" y="288" width="48" height="48" rx="12" fill="url(#glowGrad)" />
  <rect x="288" y="368" width="48" height="48" rx="12" fill="url(#glowGrad)" />
  <circle cx="392" cy="392" r="28" fill="url(#accentGrad)" filter="url(#neonGlow)" />
</svg>